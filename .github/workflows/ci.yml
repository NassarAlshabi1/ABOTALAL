name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Lint report summary
        if: always()
        run: |
          if [ -f app/build/reports/lint-results-debug.html ]; then
            echo "### Lint report generated (artifact upload disabled: storage quota full)" >> "$GITHUB_STEP_SUMMARY"
            grep -oE "[0-9]+ errors?|[0-9]+ warnings?" app/build/reports/lint-results-debug.html | head -5 >> "$GITHUB_STEP_SUMMARY" || true
          fi
