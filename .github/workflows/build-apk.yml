name: Build APK

# Re-registered by Devin to enable GitHub Actions workflow_dispatch

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KIYARA_API_KEY: ${{ secrets.KIYARA_API_KEY }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Publish Release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="build-${{ github.run_number }}-${{ github.sha }}"
          tag="${tag:0:20}"
          gh release create "$tag" \
            app/build/outputs/apk/release/*.apk \
            --title "NetCraft $tag" \
            --notes "Signed release APK built by CI for ${{ github.sha }}" \
            --prerelease
